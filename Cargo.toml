[package]
name = "mod-disenchanting_table"
version = "5.1.5"
edition = "2024"
license = "Unlicense"
description = "Dis-Enchanting Table for Sunrise: move enchantments onto books"
# Ported from: Dis-Enchanting Table 5.1.0 (Mods-For-Lupin/Dis-Enchanting-Redux, Unlicense), Minecraft Java 1.21.9.
# The textures, models, lang, recipe, loot table and tags are the upstream mod's own files.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
